<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="index.html">Home</a>
    </div>
</nav>

<div class="form-container">
    <h2>User Login</h2>
    <p class="form-subtitle">Login to your Crisis Control account</p>

    <form id="loginForm">

        <label>Phone Number</label>
        <input
                type="text"
                id="phoneNumber"
                placeholder="Enter 11 digit phone number"
                maxlength="11"
                inputmode="numeric"
                autocomplete="tel"
                required
        >
        <small id="phoneNumberError" class="field-error"></small>

        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="eye-btn" onclick="togglePassword('password', this)">👁</button>
            <small id="passwordError" class="field-error"></small>
        </div>

        <button type="submit" class="btn primary full-width">Login</button>
    </form>

    <p id="message"></p>

    <p class="switch-link">
        Do not have an account? <a href="register.html">Register here</a>
    </p>
</div>

<script src="js/login.js"></script>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.innerText = "🙈";
        } else {
            input.type = "password";
            button.innerText = "👁";
        }
    }
</script>
</body>
</html>
