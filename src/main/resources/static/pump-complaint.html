<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pump Complaint | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="public-law-book.html">Public Law Book</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="role-dashboard-page">

    <div class="role-dashboard-header">
        <div>
            <h1 id="complaintPageTitle">Submit Pump Complaint</h1>
            <p id="complaintPageSubtitle">Submit a complaint against a pump based on the public law-book rules.</p>
        </div>
        <span class="role-badge" id="complaintRoleBadge">COMPLAINT</span>
    </div>

    <div class="role-dashboard-section">
        <h2>Complaint Form</h2>
        <p id="pumpComplaintMessage"></p>

        <form id="pumpComplaintForm" class="settings-form-grid">

            <div class="settings-full-row">
                <label>Select Pump</label>
                <select id="pumpProfileId" required>
                    <option value="">Loading pumps...</option>
                </select>
            </div>

            <div>
                <label>Complaint Type</label>
                <select id="complaintType" required>
                    <option value="">Select complaint type</option>
                    <option value="REFUSAL_OF_APPROVED_COLLECTION">Refusal of approved collection</option>
                    <option value="OVERCHARGING">Overcharging</option>
                    <option value="PAYMENT_WITHOUT_FUEL">Payment without fuel</option>
                    <option value="FALSE_STOCK_REPORTING">False stock reporting</option>
                    <option value="CRITICAL_REQUEST_DISCRIMINATION">Critical request discrimination</option>
                </select>
            </div>

            <div>
                <label>Complaint Title</label>
                <input type="text" id="complaintTitle" required placeholder="Short title">
            </div>

            <div class="settings-full-row">
                <label>Complaint Description</label>
                <textarea id="complaintDescription" rows="5" required placeholder="Explain what happened clearly"></textarea>
            </div>

            <div class="settings-full-row">
                <label>Evidence Note / Reference</label>
                <textarea id="evidenceNote" rows="4" placeholder="Example: collection code, bKash transaction ID, receipt, date/time, witness details"></textarea>
            </div>

            <button type="submit" class="btn primary full-width settings-full-row">
                Submit Complaint
            </button>
        </form>
    </div>

    <div class="role-dashboard-section">
        <div class="card-title-row">
            <h2>My Pump Complaint History</h2>
            <button class="btn primary small-btn" id="refreshMyComplaintsBtn">Refresh</button>
        </div>

        <div class="table-wrapper">
            <table class="admin-users-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Pump</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Submitted</th>
                </tr>
                </thead>
                <tbody id="myPumpComplaintsBody">
                <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/api-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/pump-complaint.js"></script>

</body>
</html>
