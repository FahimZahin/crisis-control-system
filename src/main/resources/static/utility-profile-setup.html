<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Utility Profile Setup | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="utility-authority-dashboard.html">Utility Dashboard</a>
        <a href="utility-outage-management.html">Outage Management</a>
        <a href="power-outage-notices.html">Public Notices</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="role-dashboard-page">

    <div class="role-dashboard-header">
        <div>
            <h1>Utility Profile Setup</h1>
            <p>Select DPDC or DESCO and set your Dhaka city utility officer profile.</p>
        </div>
        <span class="role-badge">UTILITY PROFILE</span>
    </div>

    <div class="role-dashboard-section">
        <h2>Officer Profile</h2>

        <form id="utilityProfileForm" class="settings-form-grid">

            <div>
                <label>Provider</label>
                <select id="provider" required>
                    <option value="">Select provider</option>
                    <option value="DPDC">DPDC</option>
                    <option value="DESCO">DESCO</option>
                    <option value="BPDB">BPDB</option>
                    <option value="PALLI_BIDYUT">Palli Bidyut</option>
                </select>
            </div>

            <div>
                <label>City Corporation</label>
                <input type="text" id="cityCorporation" readonly>
            </div>

            <div>
                <label>Officer Name</label>
                <input type="text" id="officerName" placeholder="Enter officer name" required>
            </div>

            <div>
                <label>Employee ID</label>
                <input type="text" id="employeeId" placeholder="Enter employee ID" required>
            </div>

            <div>
                <label>Official Phone</label>
                <input type="text" id="officialPhone" placeholder="Enter official phone" required>
            </div>

            <div>
                <label>Service Zone</label>
                <input type="text" id="serviceZone" placeholder="Example: Uttara Zone / Ramna Zone" required>
            </div>

            <div class="settings-full-row">
                <label>Office Address</label>
                <input type="text" id="officeAddress" placeholder="Enter office address" required>
            </div>

            <button type="submit" class="btn primary full-width settings-full-row">
                Save Utility Profile
            </button>
        </form>

        <p id="utilityProfileMessage"></p>
    </div>

    <div class="role-dashboard-section">
        <h2>Allowed Thana Areas</h2>
        <div id="allowedThanaList" class="thana-chip-grid">
            Select DPDC or DESCO to view thana list.
        </div>
    </div>

</div>

<script src="js/utility-profile-setup.js"></script>

</body>
</html>
