<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<div class="form-container">
    <h2>User Registration</h2>
    <p class="form-subtitle">Create your Crisis Control account</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>

        <label>Phone Number</label>
        <input type="text" id="phoneNumber" placeholder="Enter phone number" required>

        <label>Driving License Number</label>
        <input type="text" id="drivingLicenseNumber" placeholder="Enter driving license number" required>

        <label>Address</label>
        <input type="text" id="address" placeholder="Enter address">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

        <label>Role</label>
        <select id="role" required>
            <option value="">Select Role</option>
            <option value="VEHICLE_OWNER">Vehicle Owner</option>
            <option value="PUMP_AUTHORITY">Pump Authority</option>
            <option value="ADMIN">Admin</option>
            <option value="GOVERNMENT_AUTHORITY">Government Authority</option>
            <option value="LOCAL_AUTHORITY">Local Authority</option>
            <option value="EMERGENCY_VEHICLE_AUTHORITY">Emergency Vehicle Authority</option>
            <option value="BUILDING_MANAGER">Building Manager</option>
        </select>

        <button type="submit" class="btn primary full-width">Register</button>
    </form>

    <p id="message"></p>

    <p class="switch-link">
        Already have an account? <a href="login.html">Login here</a>
    </p>
</div>

<script src="js/register.js"></script>

</body>
</html>
