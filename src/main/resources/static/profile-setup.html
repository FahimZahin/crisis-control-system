<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Profile Setup | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="dashboard.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="profile-setup-page">

    <div class="profile-setup-card">

        <h2>Vehicle Profile Setup</h2>
        <p class="form-subtitle">
            Save your vehicle information into the database for future fuel eligibility.
        </p>

        <div class="vehicle-preview-box">
            <img id="vehiclePhotoPreview" src="images/default-vehicle.jpg" alt="Vehicle photo preview">
            <p>Vehicle photo preview</p>
        </div>

        <form id="vehicleProfileForm">

            <input type="hidden" id="vehicleId">

            <label>Owner Name</label>
            <input type="text" id="ownerName" readonly>

            <label>Role</label>
            <input type="text" id="ownerRole" readonly>

            <label>Vehicle Type</label>
            <select id="vehicleType" required>
                <option value="">Enter your vehicle brand and model</option>
                <option value="BIKE">Bike</option>
                <option value="CAR">Car</option>
            </select>

            <div id="carCategorySection" class="hidden-section">
                <label>Car Category</label>
                <select id="carCategory">
                    <option value="NON_HYBRID">Non Hybrid</option>
                    <option value="HYBRID">Hybrid</option>
                </select>
            </div>

            <label>Vehicle Brand</label>
            <select id="brand" required>
                <option value="">Enter your vehicle brand and model</option>
            </select>

            <label>Vehicle Model</label>
            <select id="model" required>
                <option value="">Enter your vehicle brand and model</option>
            </select>

            <label>Fuel Type</label>
            <select id="fuelType" required>
                <option value="">Select Fuel Type</option>
            </select>

            <label>Engine CC</label>
            <input type="number" id="engineCc" readonly>

            <label>Company Declared Mileage</label>
            <input type="number" id="companyMileage" readonly>

            <label>Tank Capacity</label>
            <input type="number" id="tankCapacity" readonly>

            <label>Vehicle Number Plate</label>
            <input type="text" id="numberPlate" placeholder="Example: DHAKA METRO GA 12-3456" required>

            <label>Current Odometer Reading</label>
            <input type="number" id="odometerReading" placeholder="Enter current odometer reading" min="0" step="0.01" required>

            <label>Vehicle Photo</label>
            <input type="file" id="vehiclePhoto" accept="image/*">

            <button type="submit" class="btn primary full-width" id="saveVehicleBtn">
                Save Vehicle
            </button>

            <button type="button" class="btn danger full-width hidden-section" id="deleteVehicleBtn">
                Delete Vehicle
            </button>

        </form>

        <p id="vehicleMessage"></p>

        <div class="role-dashboard-section saved-vehicles-section">
            <h2>My Saved Vehicles</h2>

            <div id="savedVehiclesList" class="saved-vehicles-list">
                Loading vehicles...
            </div>
        </div>

    </div>

</div>

<script src="js/profile-setup.js"></script>

</body>
</html>
