<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Route Token History | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="vehicle-owner-dashboard.html">Vehicle Dashboard</a>
        <a href="route-planning.html">Route Planning</a>
        <a href="notifications.html" class="navbar-notification-link">
            🔔
            <span id="navbarNotificationBadge" class="navbar-notification-badge" style="display:none;">0</span>
        </a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="role-dashboard-page">
    <div class="role-dashboard-header">
        <div>
            <h1>Route Fuel Token History</h1>
            <p>View your active, used, expired, and cancelled route fuel tokens.</p>
        </div>
        <span class="role-badge">ROUTE TOKENS</span>
    </div>

    <div class="role-dashboard-section">
        <div class="card-title-row">
            <h2>My Route Tokens</h2>
            <button class="btn primary small-btn" id="refreshRouteTokenHistoryBtn">Refresh</button>
        </div>

        <p id="routeTokenHistoryMessage"></p>

        <div class="table-wrapper">
            <table class="admin-users-table">
                <thead>
                <tr>
                    <th>Token</th>
                    <th>Route</th>
                    <th>Vehicle</th>
                    <th>Pump</th>
                    <th>Fuel</th>
                    <th>Cost</th>
                    <th>Status</th>
                    <th>Valid Until</th>
                </tr>
                </thead>
                <tbody id="routeTokenHistoryBody">
                <tr><td colspan="8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/api-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/route-token-history.js"></script>
<script src="js/scroll-buttons.js"></script>
<script src="js/floating-chat.js"></script>
<script src="js/navbar-notifications.js"></script>

</body>
</html>
