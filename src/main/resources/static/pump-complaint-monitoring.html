<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pump Complaint Monitoring | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="public-law-book.html">Public Law Book</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="role-dashboard-page">

    <div class="role-dashboard-header">
        <div>
            <h1>Pump Complaint Monitoring</h1>
            <p id="monitoringSubtitle">View pump complaints according to your role.</p>
        </div>
        <span class="role-badge" id="monitoringRoleBadge">COMPLAINTS</span>
    </div>

    <div class="role-dashboard-section">
        <div class="card-title-row">
            <h2>Complaint List</h2>
            <button class="btn primary small-btn" id="refreshComplaintMonitoringBtn">Refresh</button>
        </div>

        <p id="complaintMonitoringMessage"></p>

        <div class="table-wrapper">
            <table class="admin-users-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Pump</th>
                    <th>Pump Thana</th>
                    <th>Complainant</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Submitted</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="complaintMonitoringBody">
                <tr><td colspan="9">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
<script src="js/scroll-position.js"></script>
<script src="js/api-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/pump-complaint-monitoring.js"></script>
<script src="js/pump-page-access-guard.js"></script>
<script src="js/scroll-buttons.js"></script>

</body>
</html>
