<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Community Chat | Crisis Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Crisis Control System</div>
    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">Direct Chat</a>
        <a href="common-community-chat.html">Common Community</a>
        <a href="notifications.html" class="navbar-notification-link">
            🔔
            <span id="navbarNotificationBadge" class="navbar-notification-badge" style="display:none;">0</span>
        </a>
        <a href="profile.html">Profile</a>
        <a href="login.html" id="logoutBtn">Logout</a>
    </div>
</nav>

<div class="role-dashboard-page">

    <div class="role-dashboard-header">
        <div>
            <h1>Local Thana Community</h1>
            <p>Communicate with users, pumps, authorities, hospitals, buildings, and utility roles in your local area.</p>
        </div>
        <span class="role-badge">LOCAL COMMUNITY</span>
    </div>

    <div class="role-dashboard-section">
        <div class="card-title-row">
            <div>
                <h2 id="localCommunityTitle">Local Community Messages</h2>
                <p class="muted-text" id="localCommunitySubtitle">Loading your local community...</p>
            </div>
            <button class="btn primary small-btn" id="refreshLocalChatBtn">Refresh</button>
        </div>

        <div id="localGroupSelectorBox" class="filter-row" style="display:none;">
            <select id="localCommunityGroupSelect">
                <option value="">Select local community</option>
            </select>
        </div>

        <p id="localCommunityMessage"></p>

        <div id="localCommunityThread" class="community-thread-box">
            <p class="muted-text">Loading...</p>
        </div>

        <form id="localCommunityForm" class="chat-send-box community-send-box">
            <input type="text" id="localCommunityInput" placeholder="Write a local community message..." maxlength="1000">
            <button type="submit" class="btn primary">Send</button>
        </form>
    </div>

</div>

<script src="js/api-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/local-community-chat.js"></script>
<script src="js/scroll-buttons.js"></script>
<script src="js/floating-chat.js"></script>
<script src="js/navbar-notifications.js"></script>

<script src="js/ui-enhancements.js"></script>
</body>
</html>
